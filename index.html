<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Coin Rush - Version 3</title>

    <meta
        name="description"
        content="Coin Rush is an original endless arcade game where you collect coins, avoid obstacles and use powerful boosts."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-wrapper">

    <!-- GAME HEADER -->

    <div class="top-bar">

        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span id="score">0</span>
        </div>

        <div class="stat">
            <span class="stat-label">COINS</span>
            <span id="coins">0</span>
        </div>

        <div class="stat">
            <span class="stat-label">BEST</span>
            <span id="best">0</span>
        </div>

        <button id="pauseBtn" class="pause-button">
            II
        </button>

    </div>


    <!-- GAME AREA -->

    <div class="canvas-container">

        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->

        <div id="startScreen" class="screen">

            <div class="logo">
                COIN
                <span>RUSH</span>
            </div>

            <p class="version">
                VERSION 3
            </p>

            <p class="description">
                Collect coins. Avoid obstacles. Survive as long as possible.
            </p>

            <div class="feature-row">

                <div class="feature">
                    <span>🪙</span>
                    <small>COINS</small>
                </div>

                <div class="feature">
                    <span>⚡</span>
                    <small>BOOST</small>
                </div>

                <div class="feature">
                    <span>🛡️</span>
                    <small>SHIELD</small>
                </div>

            </div>

            <button id="startBtn" class="main-button">
                PLAY GAME
            </button>

            <p class="controls-text">
                Desktop: ← → or A D<br>
                Mobile: touch left/right side
            </p>

        </div>


        <!-- Pause Screen -->

        <div id="pauseScreen" class="screen hidden">

            <div class="pause-title">
                GAME PAUSED
            </div>

            <button id="resumeBtn" class="main-button">
                RESUME
            </button>

        </div>


        <!-- Game Over Screen -->

        <div id="gameOverScreen" class="screen hidden">

            <div class="game-over-icon">
                ★
            </div>

            <h1>
                GAME OVER!
            </h1>

            <p class="your-score">
                Your Score
            </p>

            <div id="finalScore" class="final-score">
                0
            </div>

            <div class="result-grid">

                <div class="result-box">
                    <span>🪙</span>
                    <small>COINS</small>
                    <strong id="finalCoins">0</strong>
                </div>

                <div class="result-box">
                    <span>🏆</span>
                    <small>BEST</small>
                    <strong id="finalBest">0</strong>
                </div>

                <div class="result-box">
                    <span>🔥</span>
                    <small>COMBO</small>
                    <strong id="finalCombo">0</strong>
                </div>

            </div>

            <button id="restartBtn" class="main-button">
                PLAY AGAIN
            </button>

        </div>

    </div>


    <!-- BOTTOM CONTROLS -->

    <div class="bottom-panel">

        <div class="health-section">

            <div class="panel-title">
                LIVES
            </div>

            <div id="hearts">
                ❤️ ❤️ ❤️
            </div>

        </div>


        <div class="power-section">

            <button id="boostBtn" class="power-button boost">

                <span class="power-icon">
                    ⚡
                </span>

                <span>
                    BOOST
                </span>

                <div class="power-bar">
                    <div id="boostBar"></div>
                </div>

            </button>


            <button id="shieldBtn" class="power-button shield">

                <span class="power-icon">
                    🛡️
                </span>

                <span>
                    SHIELD
                </span>

                <div class="power-bar">
                    <div id="shieldBar"></div>
                </div>

            </button>

        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
